{{ define "main" }}
<main class="container mx-auto">
  {{ if isset .Data "Term" }}
    <h2 class="text-4xl font-bold mb-1 mt-2 mb-1">
    {{ .Data.Plural | default .Title | title }}
    </h2>
    <span class="text-3xl font-medium px-3 py-1 rounded-full">
        Academic Year {{ .Data.Term }}
    </span>
  {{ else }}
  <h2 class="text-4xl mt-2 mb-2">{{ .Title }}</h2>
  {{ end }}
  <div class="mt-6">
    {{ range .Data.Pages.GroupByDate "2006" }}
      <h3 class="text-2xl font-bold mb-2">
        <a href="#{{ .Key }}">{{ .Key }}</a>
      </h3>
      {{ range .Pages }}
      {{ partial "item.html" . }}
      {{ end }}
    {{ end }}
  </div>
</main>
{{ end }}
