  defaultTheme: system
  # Specify the default color theme, available values: light, sand, rock, system.

  displayDate: true

  displayDescription: true

  selectable: true

  author:
    name: Thomas CHECCHIN
    status: ""
    avatar: "logo.png"
    description: |
      Lyon NLP Connect is a student-led initiative by PhD students at the [ERIC Lab](https://eric.msh-lse.fr/) (Université Lyon 1 and Lyon 2), aimed at bringing together and connecting students and early-career researchers with an interest in or working in the field of NLP.

  social:
    - name: "email"
      url: "mailto:thomas.checchin@univ-lyon2.fr"

  math:
    enable: true
    provider: katex

  diagram:
    enable: true
    provider: mermaid

  comment:
    enable: true
    provider: giscus

    disqus:
    # See also https://disqus.com
      shortname: hugo-minima

    utterances:
    # See also https://utteranc.es
      repo: mivinci/hugo-theme-minima
      issueTerm: pathname
      label: comment

    giscus:
    # See also https://giscus.app
      repo: mivinci/hugo-theme-minima
      repoId: MDEwOlJlcG9zaXRvcnkzODcxMjM2NDU=
      category: Comments
      categoryId: DIC_kwDOFxMJvc4CScQm
      mapping: pathname
      inputPosition: buttom # bottom | top
      reactions: true
      metadata: false

  search:
    enable: true
    provider: fuse
    title: Search
    placeholder: Enter keywords

    fuse:
    # See also https://fusejs.io
      keys:
        - title
        - permalink
        - summary
        - content
      distance: 100
      location: 0
      threshold: 0.6
      ignoreLocation: false
      isCaseSensitive: false
      includeScore: false
      includeMatches: false
      minMatchCharLength: 1
      shouldSort: true
      findAllMatches: false


menu:
  main:
    - identifier: home
      name: Home
      weight: 1
    - identifier: sessions
      name: Sessions
      weight: 2
    - identifier: community
      name: Community
      weight: 3
    - identifier: search
      name: '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 640 640"><path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/></svg>'
      weight: 4

taxonomies:
  category: categories
  sessions: sessions

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
# **DO NOT EDIT** anything below.
# Because unlike other Hugo themes, the way Minima uses to do syntax
# highlighting depends strongly on configurations below, so that the
# color theme of code blocks changes with the blog color theme, instead
# of being static like you may have seen on other Hugo themes.
  highlight:
    lineNos: true
    noClasses: false
